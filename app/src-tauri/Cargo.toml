[package]
name = "lockdown"
version = "0.2.8"
description = "Lockdown: find every way in, then fix it"
authors = ["Westward"]
edition = "2021"

[lib]
name = "lockdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
