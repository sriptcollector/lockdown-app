name: Install test
# Runs the public one-line installers on fresh VMs and checks the app and its engine start.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: One-line install
        run: curl -fsSL https://lockdown.westwardconsulting.ai/install.sh | sh
      - name: App is installed, not quarantined, and its engine answers
        run: |
          APP=/Applications/Lockdown.app; [ -d "$APP" ] || APP="$HOME/Applications/Lockdown.app"
          test -d "$APP"
          ! xattr -p com.apple.quarantine "$APP" 2>/dev/null
          codesign --verify --deep --strict "$APP"
          "$APP/Contents/MacOS/lockdown-engine" credits | head -3
          sleep 5; pgrep -f "Lockdown.app" && echo "app running"
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: One-line install
        shell: powershell
        run: irm https://lockdown.westwardconsulting.ai/install.ps1 | iex
      - name: App is installed and its engine answers
        shell: powershell
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Lockdown'
          Get-ChildItem $dir | Select-Object Name
          & (Join-Path $dir 'lockdown-engine.exe') credits | Select-Object -First 3
          Start-Sleep 5; Get-Process lockdown* | Select-Object Name
