name: First run from default settings
# A brand-new user's first run on fresh Macs and PCs, recorded on video. Installs the beta with the
# one-line installer, resets every permission Lockdown could already have, makes admin changes need a
# real password / a real Yes, then clicks through the real app window and the real system popups like a
# person: one "Don't Allow" and one "Cancel" on purpose, to prove the way back in works.
# Video and screenshots go on a "first-run-<run>" pre-release.
on: workflow_dispatch
permissions:
  contents: write
env:
  # Mac: an account that already has a trial. Windows: signed in but unpaid, so it buys the trial on staging.
  LOCKDOWN_TEST_ACCOUNT: ${{ secrets.LOCKDOWN_TEST_ACCOUNT }}
  LOCKDOWN_TEST_SIGNED_IN: ${{ secrets.LOCKDOWN_TEST_SIGNED_IN }}
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the beta like a customer
        run: curl -fsSL https://lockdown.westwardconsulting.ai/beta/install.sh | sh; sleep 6; pkill -f Lockdown.app || true
      - name: Default state (no permissions, admin needs a password)
        run: |
          tccutil reset All ai.westwardconsulting.lockdown || true
          # A second admin account with a known password: the password box takes any admin's name and password.
          PW="Lk$(openssl rand -hex 8)"; echo "::add-mask::$PW"; echo "PW=$PW" >> "$GITHUB_ENV"
          sudo sysadminctl -addUser lktester -fullName "Lockdown Tester" -password "$PW" -admin
          D="$HOME/Library/Application Support/Lockdown"; mkdir -p "$D"; printf '%s' "$LOCKDOWN_TEST_ACCOUNT" > "$D/account.json"; chmod 600 "$D/account.json"
          mkdir -p ~/Downloads && printf 'name,url,username,password\nbank,https://bank.test,me,hunter2\n' > ~/Downloads/passwords.csv
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off
          # Last: take away password-free sudo, like a normal Mac account.
          sudo sh -c 'for f in $(grep -rlE "NOPASSWD" /etc/sudoers /etc/sudoers.d 2>/dev/null); do sed -i "" "s/NOPASSWD: *//" "$f"; done' 
          sudo -k; if sudo -n true 2>/dev/null; then echo "sudo is still password-free"; exit 1; fi
      - name: First run, like a person (and watch for any system popup)
        run: |
          AX() { osascript -l JavaScript engine/test/first-run/ax.js "$@"; }
          shot() { screencapture -x "shots/$1.png"; echo "shot $1"; }
          mkdir -p shots
          # Popup watch: any window from the system's permission or password prompts counts as a failure.
          ( while true; do osascript -e 'tell application "System Events" to get name of every process whose (name is "SecurityAgent" or name is "UserNotificationCenter" or name is "CoreServicesUIAgent" or name is "universalAccessAuthWarn") and (count of windows) > 0' 2>/dev/null | grep -v '^$' >> popups.txt || true; sleep 2; done ) & WATCH=$!
          screencapture -v -V 1200 -k shots/first-run-mac.mov & REC=$!
          APP=/Applications/Lockdown.app; [ -d "$APP" ] || APP="$HOME/Applications/Lockdown.app"
          open "$APP"; sleep 8; shot 00-opened
          AX click "Check my computer" 90 Lockdown
          AX find "Checking" 30 Lockdown && shot 01-checking
          AX find "Fix everything" 300 Lockdown && shot 02-results
          AX click "Fix everything" 10 Lockdown; sleep 2
          for i in 1 2 3 4 5; do AX click "Next" 3 Lockdown || break; sleep 1; done
          AX click "Fix everything" 5 Lockdown || true
          # One heads-up, then exactly one password box (Orion, 2026-11-11). Cancel first: nothing may change.
          if AX find "Your Mac will ask for your password once" 30 Lockdown; then
            shot 03-heads-up
            AX click "Continue" 10 Lockdown
            { AX find "needs your password" 60 SecurityAgent && sleep 1 && shot 04-password-box; } || true
            AX click "Cancel" 30 SecurityAgent; sleep 3
            AX find "still need" 120 Lockdown && shot 05-cancelled-nothing-changed
            AX click "Try again" 10 Lockdown
            AX find "needs your password" 60 SecurityAgent || true; sleep 1
            osascript -e "tell application \"System Events\" to tell process \"SecurityAgent\"" -e "set value of text field 1 of window 1 to \"lktester\"" -e "set value of text field 2 of window 1 to \"$PW\"" -e "end tell" || true
            AX click "OK" 20 SecurityAgent
          fi
          AX find "safe" 300 Lockdown || AX find "Much safer" 30 Lockdown; sleep 2; shot 06-done
          kill $WATCH || true; kill -INT $REC || true; wait $REC || true
          echo "popup watcher checked every 2 s for the whole run" 
          # The one allowed prompt is the password box (SecurityAgent). Anything else fails the run.
          OTHER=$(tr ',' '\n' < popups.txt | sed 's/^ *//' | grep -v "^SecurityAgent$" | grep -v '^$' | sort -u || true)
          if [ -n "$OTHER" ]; then echo "OTHER POPUPS SEEN: $OTHER"; exit 1; else echo "ONLY THE PASSWORD BOX appeared during the whole run"; fi
      - name: Attach video and screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="first-run-${GITHUB_RUN_NUMBER}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --prerelease --title "First run ${GITHUB_RUN_NUMBER}" --notes "Default-state first run: video and screenshots" || true
          for f in shots/*; do cp "$f" "/tmp/mac-$(basename "$f")"; gh release upload "$tag" "/tmp/mac-$(basename "$f")" --clobber || true; done

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the beta like a customer
        shell: powershell
        run: |
          irm https://lockdown.westwardconsulting.ai/beta/install.ps1 | iex
          Start-Sleep 8; Get-Process lockdown* -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Default state (admin changes need a real Yes, account not paid yet)
        shell: powershell
        run: |
          # Signed in on staging but unpaid: the run buys the 7-day trial through the real app (fake purchase on staging).
          $acct = $env:LOCKDOWN_TEST_SIGNED_IN | ConvertFrom-Json
          Invoke-RestMethod -Method Post -Uri https://lockdown-staging.westwardconsulting.ai/api/test/reset -Headers @{ authorization = "Bearer $($acct.session)" } | Out-Null
          [Environment]::SetEnvironmentVariable('LOCKDOWN_API', 'https://lockdown-staging.westwardconsulting.ai', 'User')
          # Default Windows: ask before apps make changes (a Yes/No would show if Lockdown ever asked for admin).
          # Windows' default: ask before letting apps make changes, on the normal desktop so it can be recorded.
          Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name ConsentPromptBehaviorAdmin -Value 5
          Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name PromptOnSecureDesktop -Value 0
          [IO.File]::WriteAllText((Join-Path $env:LOCALAPPDATA 'Lockdown\account.json'), $env:LOCKDOWN_TEST_SIGNED_IN)
          Set-NetFirewallProfile -Profile Public -Enabled False
          New-Item -ItemType Directory -Force "$HOME\Downloads" | Out-Null
          "name,url,username,password`nbank,https://bank.test,me,hunter2" | Set-Content "$HOME\Downloads\Chrome Passwords.csv"
          choco install ffmpeg -y --no-progress | Out-Null
      - name: First run, like a person (and watch for any admin prompt)
        shell: powershell
        run: |
          $U = "engine\test\first-run\uia.ps1"
          function UI($a, $l, $w = "", $t = 60) { & powershell -NoProfile -File $U $a $l -Window $w -Timeout $t | Out-Host; return ($LASTEXITCODE -eq 0) }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          function Shot($n) { $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds; $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height; [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size); $bmp.Save("shots\$n.png"); "shot $n" }
          # Admin-prompt watch: consent.exe is the Windows Yes/No box.
          $watch = Start-Job { $seen = 0; while ($true) { if (Get-Process consent -ErrorAction SilentlyContinue) { $seen++ }; if ($seen) { Set-Content "$using:PWD\uac.txt" $seen }; Start-Sleep -Milliseconds 500 } }
          $rec = Start-Process ffmpeg -ArgumentList '-y','-f','gdigrab','-framerate','8','-i','desktop','-pix_fmt','yuv420p','shots\first-run-win.mkv' -PassThru -WindowStyle Hidden
          $act = New-ScheduledTaskAction -Execute (Join-Path $env:LOCALAPPDATA 'Lockdown\lockdown.exe')
          $who = New-ScheduledTaskPrincipal -UserId "$env:USERDOMAIN\$env:USERNAME" -LogonType Interactive -RunLevel Limited
          Register-ScheduledTask -TaskName LockdownFirstRun -Action $act -Principal $who -Force | Out-Null
          Start-ScheduledTask -TaskName LockdownFirstRun; Start-Sleep 12; Shot 00-opened
          UI click "Check my computer" Lockdown 90 | Out-Null
          if (UI find "Fix everything" Lockdown 300) { Shot 01-results }
          UI click "Fix everything" Lockdown 10 | Out-Null; Start-Sleep 2
          foreach ($i in 1..5) { if (-not (UI click "Next" Lockdown 3)) { break }; Start-Sleep 1 }
          UI click "Fix everything" Lockdown 5 | Out-Null
          if (UI find "Fix everything with Pro" Lockdown 30) { Shot 01b-plan; UI click "Start free week" Lockdown 10 | Out-Null; Start-Sleep 8; Shot 01c-checkout-opened }
          if (-not (UI find "safe" Lockdown 300)) { UI find "Much safer" Lockdown 30 | Out-Null }
          Start-Sleep 2; Shot 02-done
          if (UI find "optional fix" Lockdown 10) { Shot 03-optional-list }
          Stop-Process -Id $rec.Id; Stop-Job $watch; Start-Sleep 2
          cmd /c "ffmpeg -y -loglevel error -i shots\first-run-win.mkv -c copy shots\first-run-win.mp4 2>nul"; Remove-Item shots\first-run-win.mkv -ErrorAction SilentlyContinue
          if (Test-Path uac.txt) { "ADMIN PROMPT SEEN"; exit 1 } else { "NO ADMIN PROMPT during the whole run" }
      - name: Attach video and screenshots
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="first-run-${GITHUB_RUN_NUMBER}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --prerelease --title "First run ${GITHUB_RUN_NUMBER}" --notes "Default-state first run: video and screenshots" || true
          for f in shots/*; do cp "$f" "/tmp/win-$(basename "$f")"; gh release upload "$tag" "/tmp/win-$(basename "$f")" --clobber || true; done
